<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  内容安全策略：默认禁止一切外部资源。
  connect-src 仅允许 Tauri 本机 IPC；全部夸克与传输网络访问由 Rust 核心承担。
  script-src / style-src 允许 'self' 与 file:，以便在 Electron(file://) 与本地浏览器中均可直接打开本页调试。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src ipc: http://ipc.localhost https://ipc.localhost; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>夸克网盘 · 极简版</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- 顶部提示条（未注入桥接层 / 登录态失效 / 开发假数据模式） -->
<div class="banners" id="banners" role="status" aria-live="polite"></div>

<div class="app">

  <!-- ======================= 左侧极简导航 ======================= -->
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="ic"><use href="#i-cloud"></use></svg>
      </span>
      <span class="brand-text">夸克网盘<em>极简版</em></span>
    </div>

    <nav class="nav" id="nav" aria-label="主导航">
      <button type="button" class="nav-item" data-view="files">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-folder"></use></svg>
        <span>全部文件</span>
      </button>
      <button type="button" class="nav-item" data-view="transfers">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-transfer"></use></svg>
        <span>传输列表</span>
        <span class="nav-badge" id="transfer-badge" hidden></span>
      </button>
      <button type="button" class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-settings"></use></svg>
        <span>设置</span>
      </button>
    </nav>

    <div class="sidebar-foot" id="sidebar-foot"></div>
    <button type="button" class="btn btn-ghost btn-quit" id="btn-quit" title="退出应用并保存任务进度">退出客户端</button>
  </aside>

  <!-- ======================= 右侧主区 ======================= -->
  <main class="main">

    <!-- 顶栏：面包屑 + 搜索 + 操作 + 账号区 -->
    <header class="topbar">
      <div class="crumbs" id="crumbs" aria-label="目录路径"></div>

      <div class="topbar-tools">
        <div class="search" id="search-box">
          <svg viewBox="0 0 24 24" class="ic search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
          <input type="search" id="search-input" placeholder="搜索文件名称" autocomplete="off" spellcheck="false" aria-label="搜索文件名称">
          <button type="button" class="search-clear" id="search-clear" title="清空搜索" aria-label="清空搜索" hidden>
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-close"></use></svg>
          </button>
        </div>

        <button type="button" class="btn btn-icon" id="btn-refresh" title="刷新当前目录" aria-label="刷新当前目录">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-refresh"></use></svg>
        </button>

        <button type="button" class="btn" id="btn-mkdir" title="在当前目录新建文件夹">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-folder-plus"></use></svg>
          <span class="btn-label">新建文件夹</span>
        </button>

        <button type="button" class="btn btn-primary" id="btn-upload" title="上传本地文件">
          <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-upload"></use></svg>
          <span class="btn-label">上传</span>
        </button>

        <div class="account" id="account"></div>
      </div>
    </header>

    <!-- ======================= 视图：全部文件 ======================= -->
    <section class="view" id="view-files">

      <div class="bulkbar" id="bulkbar" hidden>
        <span class="bulk-count" id="bulk-count">已选 0 项</span>
        <div class="bulk-actions">
          <button type="button" class="btn btn-sm" data-bulk="download">
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-download"></use></svg><span class="btn-label">下载</span>
          </button>
          <button type="button" class="btn btn-sm" data-bulk="move">
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-move"></use></svg><span class="btn-label">移动到</span>
          </button>
          <button type="button" class="btn btn-sm" data-bulk="copy">
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-copy"></use></svg><span class="btn-label">复制到</span>
          </button>
          <button type="button" class="btn btn-sm btn-danger" data-bulk="remove">
            <svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><use href="#i-trash"></use></svg><span class="btn-label">删除</span>
          </button>
          <button type="button" class="btn btn-sm btn-ghost" data-bulk="clear">取消选择</button>
        </div>
      </div>

      <div class="listhead" id="listhead">
        <span class="cb-cell">
          <label class="cb" title="全选已加载的项目">
            <input type="checkbox" id="check-all" aria-label="全选已加载的项目">
            <i aria-hidden="true"></i>
          </label>
        </span>
        <span class="col-name">名称</span>
        <span class="col-size">大小</span>
        <span class="col-time">修改时间</span>
        <span class="col-ops">操作</span>
      </div>

      <div class="listwrap" id="listwrap" tabindex="-1">
        <div class="list" id="list" role="list"></div>
        <div class="listfoot" id="listfoot"></div>
      </div>
    </section>

    <!-- ======================= 视图：传输列表 ======================= -->
    <section class="view" id="view-transfers" hidden>
      <div class="section-head">
        <h2 class="section-title">传输列表</h2>
        <div class="section-actions">
          <span class="muted" id="transfers-summary"></span>
          <button type="button" class="btn btn-sm btn-ghost" id="btn-clear-finished">清除已结束记录</button>
        </div>
      </div>
      <div class="tlist" id="tlist"></div>
    </section>

    <!-- ======================= 视图：设置 ======================= -->
    <section class="view" id="view-settings" hidden>
      <div class="section-head">
        <h2 class="section-title">设置</h2>
      </div>

      <div class="setcard">
        <div class="setrow">
          <div class="setlabel">
            <div class="setname">下载目录</div>
            <div class="sethint">下载任务默认保存到此目录，同名冲突由主进程处理。</div>
          </div>
          <div class="setcontrol">
            <input type="text" id="set-download-dir" class="input input-path" readonly placeholder="尚未设置">
            <button type="button" class="btn btn-sm" id="btn-pick-dir">选择目录</button>
            <button type="button" class="btn btn-sm btn-ghost" id="btn-open-dir">打开</button>
          </div>
        </div>

        <div class="setrow">
          <div class="setlabel">
            <div class="setname">同时上传的文件数</div>
            <div class="sethint">多文件上传时同时进行的任务数，范围 1–8。</div>
          </div>
          <div class="setcontrol">
            <input type="number" id="set-up-conc" class="input input-num" min="1" max="8" step="1">
          </div>
        </div>

        <div class="setrow">
          <div class="setlabel">
            <div class="setname">上传分片预读并发</div>
            <div class="sethint">同时预读的分片数，范围 1–8；上传请求按服务端要求依次发送。</div>
          </div>
          <div class="setcontrol">
            <input type="number" id="set-up-part" class="input input-num" min="1" max="8" step="1">
          </div>
        </div>

        <div class="setrow">
          <div class="setlabel">
            <div class="setname">同时下载的文件数</div>
            <div class="sethint">多文件下载时同时进行的任务数，范围 1–5。</div>
          </div>
          <div class="setcontrol">
            <input type="number" id="set-down-conc" class="input input-num" min="1" max="5" step="1">
          </div>
        </div>

        <div class="setrow">
          <div class="setlabel">
            <div class="setname">单文件下载并行连接数</div>
            <div class="sethint">大文件多连接并行下载，决定大文件速度，范围 1–16。</div>
          </div>
          <div class="setcontrol">
            <input type="number" id="set-down-parallel" class="input input-num" min="1" max="16" step="1">
          </div>
        </div>

        <div class="setrow">
          <div class="setlabel">
            <div class="setname">主题</div>
            <div class="sethint">深浅色跟随设置持久化保存。</div>
          </div>
          <div class="setcontrol">
            <div class="segmented" id="set-theme" role="radiogroup" aria-label="主题">
              <button type="button" class="seg" data-theme="light" role="radio" aria-checked="false">浅色</button>
              <button type="button" class="seg" data-theme="dark" role="radio" aria-checked="false">深色</button>
            </div>
          </div>
        </div>
      </div>

      <div class="setcard">
        <div class="setrow">
          <div class="setlabel">
            <div class="setname">账号</div>
            <div class="sethint" id="set-account-hint">查看当前登录状态。</div>
          </div>
          <div class="setcontrol">
            <button type="button" class="btn btn-sm" id="btn-verify">检查登录状态</button>
            <button type="button" class="btn btn-sm" id="btn-login-2">重新登录</button>
            <button type="button" class="btn btn-sm btn-ghost" id="btn-logout-2">退出登录</button>
          </div>
        </div>
      </div>

      <div class="setcard">
        <div class="setrow">
          <div class="setlabel">
            <div class="setname">运行环境</div>
            <div class="sethint" id="set-env">—</div>
          </div>
          <div class="setcontrol">
            <button type="button" class="btn btn-sm btn-ghost" id="btn-env-check">重新检测桥接层</button>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- 拖拽上传提示遮罩 -->
<div class="dropmask" id="dropmask" hidden>
  <div class="dropmask-inner">
    <svg viewBox="0 0 24 24" class="ic dropmask-ic" aria-hidden="true"><use href="#i-upload"></use></svg>
    <div class="dropmask-title">释放以上传</div>
    <div class="dropmask-sub" id="dropmask-sub">文件将上传到当前目录</div>
  </div>
</div>

<!-- toast 容器 -->
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<!-- 自绘对话框 / 目录选择器 容器 -->
<div class="overlay-root" id="overlay-root"></div>

<!-- 右键菜单 -->
<div class="ctxmenu" id="ctxmenu" hidden role="menu"></div>
