[package]
name = "quark-drive-lite-tauri"
version = "0.3.0-alpha.1"
edition = "2021"
license = "MIT"
default-run = "quark-drive-lite-tauri"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
quark-core = { path = "../crates/quark-core" }
quark-transfer = { path = "../crates/quark-transfer" }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
rfd = "=0.16.0"
open = "5"
fs2 = "0.4"
