name: Tauri migration checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci --ignore-scripts
      - run: cargo test --workspace --locked
      - run: npm test
      - name: Compile native app (no publication)
        run: npx tauri build --no-bundle
