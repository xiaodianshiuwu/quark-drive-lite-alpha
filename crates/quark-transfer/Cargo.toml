[package]
name = "quark-transfer"
version = "0.1.0"
edition = "2021"

[dependencies]
quark-core = { path = "../quark-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
httpdate = "1"
unicode-normalization = "0.1"
mime_guess = "2"
libc = "0.2"
bytes = "1"

[dev-dependencies]
tempfile = "3"
fs2 = "0.4"
